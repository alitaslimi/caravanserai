onchain_reference:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: clickhouse
      host: "{{ env_var('CLICKHOUSE_HOST', '127.0.0.1') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'learner') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', 'learner') }}"
      schema: "{{ env_var('CLICKHOUSE_DB', 'analytics') }}"
      secure: false
      threads: 2

