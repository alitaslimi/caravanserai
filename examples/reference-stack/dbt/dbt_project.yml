name: "onchain_reference"
version: "1.0.0"
config-version: 2
profile: "onchain_reference"
model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]
models:
  onchain_reference:
    staging:
      +materialized: view
    facts:
      +materialized: incremental
      +incremental_strategy: delete+insert
    marts:
      +materialized: table

